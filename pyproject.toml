[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditgym"
version = "1.0.0"
description = "Reproducible RL environment and evaluator for financial-audit agents (Genesis Hackathon 2026, FinTech)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auditgym = "auditgym.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditgym = ["ui/static/*", "ui/static/fonts/*"]
