name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-and-verify:
    name: tests + verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit, rubric and attack tests
        run: python -m unittest discover -s tests -q
      - name: The one verification command
        run: python -m auditgym.verify --out ci-report.json --trajectories ci-trajectories.jsonl
      - name: Committed episodes match the generator (golden hashes)
        run: python -m unittest tests.test_golden -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: ci-report.json
  newer-python:
    name: tests + verify (Python ${{ matrix.python }}, pip install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install without Docker (no dependencies are fetched)
        run: python -m pip install -e .
      - name: Unit, rubric and attack tests
        run: python -m unittest discover -s tests -q
      - name: The one verification command, as the installed command
        run: auditgym verify --out ci-report.json --trajectories ci-trajectories.jsonl
  ui-e2e:
    name: UI end-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      AUDITGYM_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the browser driver (dev-only, never imported by src/)
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Full journey by mouse and keyboard, layouts, fonts, offline
        run: python -m unittest tests.test_ui_browser -v
  docker-offline:
    name: docker build + offline verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t auditgym .
      - name: Verify with no network, 2 CPU, 4 GB
        run: docker run --rm --network none --cpus=2 --memory=4g auditgym
      - name: Demo
        run: docker run --rm --network none auditgym demo
  gymnasium-adapter:
    name: Gymnasium adapter (check_env)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      AUDITGYM_GYM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gymnasium (optional adapter test only, never imported by src/)
        run: python -m pip install gymnasium
      - name: Run gymnasium.utils.env_checker.check_env
        run: python -m unittest tests.test_gymnasium_env -v
